<script type="text/javascript">

	function getCurrentPage() {
		var currentPage;
		try {currentPage = Reveal.get_indexh().toString() +"," + Reveal.get_indexv().toString()+","+(Reveal.getSlidePastCount()+1).toString()+","+Math.floor(Reveal.getProgress()*100).toString()} catch (e){console.log('Error'+e.name + ":" + e.message + "\n" + e.stack);}
	return currentPage;}
